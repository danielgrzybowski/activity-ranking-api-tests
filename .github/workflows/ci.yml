name: run tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Harness self-check
        run: npm run selfcheck

      - name: Validate every step is wired
        run: npm run validate

      - name: Specification is satisfiable
        run: npm run demo:green

      - name: Specification suite
        continue-on-error: true
        run: npm test

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
