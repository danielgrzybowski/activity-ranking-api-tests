name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The harness must be green even though the suite is not: it tells
      # "the tooling is broken" apart from "the API does not exist yet".
      - name: Harness self-check
        run: npm run selfcheck

      # bddgen fails on an undefined step or a step whose argument count does
      # not match its Gherkin, which is a defect in the suite rather than the
      # intended red state. No browsers are downloaded: this is an API suite.
      - name: Validate every step is wired
        run: npm run validate

      # Expected red until the API exists. Non-blocking on purpose - flip
      # continue-on-error off in the same commit that lands the implementation.
      - name: Specification suite
        continue-on-error: true
        run: npm test

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
